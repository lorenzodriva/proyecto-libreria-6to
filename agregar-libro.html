<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar libro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body">
    <main class="admin-layout">
        <section class="form-card">
            <form id="libro-form" novalidate>
                <div class="field-group">
                    <input id="titulo" name="titulo" type="text" placeholder="NOMBRE" class="text-input" autocomplete="off">
                </div>

                <div class="field-group">
                    <input id="urlImagen" name="urlImagen" type="url" placeholder="URL" class="text-input" autocomplete="off">
                </div>

                <div class="fieldset-group">
                    <div id="generos" class="tag-list" aria-label="Géneros del libro">
                        <button type="button" class="tag" data-genero="Terror">terror</button>
                        <button type="button" class="tag" data-genero="Comedia">comedia</button>
                        <button type="button" class="tag" data-genero="Romance">romance</button>
                        <button type="button" class="tag" data-genero="Otros">otros...</button>
                    </div>
                </div>

                <div class="field-group">
                    <input id="autor" name="autor" type="text" placeholder="AUTOR" class="text-input" autocomplete="off">
                </div>

                <div class="field-group">
                    <input id="descripcion" name="descripcion" type="text" placeholder="DESCRIPCIÓN" class="text-input" autocomplete="off">
                </div>

                <div class="field-group inline-field">
                    <label for="precio">PRECIO:</label>
                    <input id="precio" name="precio" type="number" min="0" step="0.01" placeholder="0.00" class="price-input">
                    <span>$</span>
                </div>

                <div id="duplicado-container" class="field-group hidden">
                    <label for="duplicadoLibro">Este título ya existe. ¿Qué libro te referís?</label>
                    <select id="duplicadoLibro" class="select-input">
                        <option value="">Seleccionar</option>
                    </select>
                </div>

                <div class="action-row">
                    <button type="button" id="cancelarBtn" class="btn btn-secondary">Cancelar</button>
                    <button type="button" id="previewBtn" class="btn btn-tertiary" disabled>Vista previa</button>
                    <button type="submit" id="submitBtn" class="btn btn-primary">Agregar</button>
                </div>

                <div id="message" class="form-message" aria-live="polite"></div>
            </form>
        </section>
    </main>

    <div id="preview-modal" class="modal hidden" aria-hidden="true">
        <div class="modal-content">
            <button type="button" class="modal-close" id="closePreview" aria-label="Cerrar vista previa">×</button>
            <h3>Vista previa del libro</h3>
            <div id="preview-book" class="preview-book"></div>
        </div>
    </div>

    <div id="success-modal" class="modal hidden" aria-hidden="true">
        <div class="success-content">
            <div class="checkmark">✓</div>
            <p>libro registrado correctamente</p>
        </div>
    </div>

    <script src="agregar-libro.js"></script>
</body>
</html>
